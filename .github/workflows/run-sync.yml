name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # Allows you to manual trigger the sync from the GitHub Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://dongng2000:$HF_TOKEN@huggingface.co/spaces/dongng2000/msai631-rag-chatbot main
